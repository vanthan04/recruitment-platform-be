name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # ~80 pre-existing @typescript-eslint/no-unsafe-* violations across the
      # codebase (never enforced) — report only, don't block on it yet.
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"
        continue-on-error: true
      # Blocking at the critical threshold: nothing in the tree is currently
      # critical, so this can't false-fail. High-severity stays report-only
      # since the only two left (deepmerge-ts via @prisma/config, mysql2 via
      # prisma's own multi-driver support) are Prisma-CLI-only transitive
      # deps this app never exercises at runtime (datasource is postgresql
      # only, prisma.config.ts is static, not attacker-influenced) — the
      # audit's own suggested "fix" is a Prisma major-version *downgrade*,
      # which would be a worse trade than living with these two for now.
      - run: npm audit --audit-level=critical
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: recruitment_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Simulates S3 so file-upload e2e tests (CV upload, chat) can run for
      # real instead of just against the DB.
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # REDIS_URL is required (see env.validation.ts) — the app won't boot
      # without it, e2e included.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/recruitment_platform?schema=public
      REDIS_URL: redis://localhost:6379
      # REDIS_URL being required (env.validation.ts) means these throttle
      # counters are now genuinely shared, via the one Redis instance above,
      # across every e2e spec file's own app instance in this run — their
      # combined request volume (66 total HTTP calls across all four files
      # at last count) legitimately exceeds both real-deployment defaults
      # (60 global, 5 on auth endpoints). Raised generously rather than
      # tuned to the exact current count so the suite has headroom to grow.
      GLOBAL_THROTTLE_LIMIT: "1000"
      AUTH_THROTTLE_LIMIT: "1000"
      JWT_SECRET: ci-test-secret
      JWT_EXPIRATION: "900000"
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_REFRESH_EXPIRATION: "7d"
      MAIL_HOST: smtp.example.com
      MAIL_PORT: "587"
      MAIL_USER: ci@example.com
      MAIL_PASS: ci-dummy-password
      MAIL_FROM: ci@example.com
      S3_REGION: ap-southeast-1
      S3_BUCKET: ci-test-bucket
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_ENDPOINT: http://localhost:4566
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - name: Create S3 bucket in LocalStack
        run: aws --endpoint-url=http://localhost:4566 s3 mb s3://ci-test-bucket
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-southeast-1
      - run: npm run test:e2e
