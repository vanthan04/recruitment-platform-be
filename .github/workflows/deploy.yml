name: Deploy

# Manual only — this is a skeleton. Wire up the secrets/variables listed
# in DEPLOY.md, then trigger from the Actions tab when ready. Not on push,
# so an unfinished setup can't half-deploy on every commit to main.
on:
  workflow_dispatch:

env:
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  CONTAINER_NAME: recruitment-platform-be
  # Where the container's runtime env vars live in SSM Parameter Store —
  # must match the path the infra repo's Terraform writes parameters to.
  SSM_PARAM_PATH: /recruitment-platform/prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          # Narrow "deploy" credentials only — ECR push + SSM Run Command
          # against this one instance. Provisioning the instance itself
          # uses a separate, broader-permission credential set that lives
          # in the recruitment-platform-infra repo, not here. Prefer OIDC
          # (role-to-assume) over long-lived access keys once you're
          # comfortable setting that up — see DEPLOY.md.

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM Run Command
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          SCRIPT_B64=$(base64 -w0 scripts/deploy-remote.sh)
          REMOTE_CMD="echo $SCRIPT_B64 | base64 -d | bash -s -- '$IMAGE' '$ECR_REGISTRY' '$AWS_REGION' '$SSM_PARAM_PATH' '$CONTAINER_NAME'"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters "{\"commands\":[$(jq -Rs . <<< "$REMOTE_CMD")]}" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" --output text)

          echo "--- stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
